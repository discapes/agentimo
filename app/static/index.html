<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agentimo</title>
<script>
  // Phones get the app itself; wider screens get the app beside the control room.
  if (matchMedia("(max-width: 760px)").matches) location.replace("/app");
</script>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; background: #fff; }
  body { display: flex; }
  /* The phone is as tall as the window allows; its width follows from a phone's proportions. */
  .left { flex: none; height: 100%; padding: 8px; display: flex; align-items: center; }
  .phone { position: relative; height: 100%; aspect-ratio: 9 / 19.2; background: #000; border-radius: 46px; padding: 9px; }
  .phone iframe { width: 100%; height: 100%; border: 0; border-radius: 38px; background: #fff; display: block; }
  .right { flex: 1; min-width: 0; height: 100%; }
  .right iframe { width: 100%; height: 100%; border: 0; display: block; }
</style>
</head>
<body>
<div class="left"><div class="phone"><iframe src="/app?frame=1" allow="microphone; autoplay"></iframe></div></div>
<div class="right"><iframe src="/room"></iframe></div>
</body>
</html>
